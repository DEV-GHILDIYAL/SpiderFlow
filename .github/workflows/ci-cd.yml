name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1

jobs:
  # ── Backend Tests ──
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest moto boto3
      - run: pytest tests/ -v

  # ── Frontend Build ──
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # ── Worker Docker Build ──
  worker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t spiderflow-worker ./worker

  # ── CDK Synth (Infrastructure Validation) ──
  infra-synth:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g aws-cdk
      - run: pip install -r requirements.txt
      - run: cdk synth --all
        env:
          CDK_DEFAULT_ACCOUNT: "000000000000"
          CDK_DEFAULT_REGION: us-east-1

  # ── Deploy (only on main branch push) ──
  deploy:
    needs: [backend-tests, frontend-build, worker-build, infra-synth]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Deploy infrastructure
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g aws-cdk
      - run: pip install -r infra/requirements.txt
      - run: cdk deploy --all --require-approval never
        working-directory: infra

      # Build and push worker Docker image
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login
      - run: |
          docker build -t spiderflow-worker ./worker
          docker tag spiderflow-worker:latest ${{ steps.ecr-login.outputs.registry }}/spiderflow-worker:latest
          docker push ${{ steps.ecr-login.outputs.registry }}/spiderflow-worker:latest

      # Build and deploy frontend
      - run: |
          cd frontend
          npm ci
          npm run build
          aws s3 sync out/ s3://${{ secrets.FRONTEND_BUCKET_NAME }} --delete
