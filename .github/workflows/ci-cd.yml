name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1

jobs:

  # ── Frontend Build ──
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # ── Deploy (only on main branch push) ──
  deploy:
    needs: [frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Deploy infrastructure
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g aws-cdk
      - run: pip install -r infra/requirements.txt
      - run: cdk deploy --all --require-approval never
        working-directory: infra

      # Build and deploy frontend
      - run: |
          # Fetch dynamic variables securely from your initialized CloudFormation Stacks
          POOL_ID=$(aws cloudformation describe-stacks --region us-east-1 --stack-name SpiderFlowCognito --query "Stacks[0].Outputs[?OutputKey=='UserPoolId'].OutputValue" --output text)
          CLIENT_ID=$(aws cloudformation describe-stacks --region us-east-1 --stack-name SpiderFlowCognito --query "Stacks[0].Outputs[?OutputKey=='UserPoolClientId'].OutputValue" --output text)
          API_URL=$(aws cloudformation describe-stacks --region us-east-1 --stack-name SpiderFlowApi --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          
          cd frontend
          echo "NEXT_PUBLIC_USER_POOL_ID=$POOL_ID" >> .env.production
          echo "NEXT_PUBLIC_USER_POOL_CLIENT_ID=$CLIENT_ID" >> .env.production
          echo "NEXT_PUBLIC_API_URL=$API_URL" >> .env.production
          
          npm ci
          npm run build
          aws s3 sync out/ s3://${{ secrets.FRONTEND_BUCKET_NAME }} --delete
